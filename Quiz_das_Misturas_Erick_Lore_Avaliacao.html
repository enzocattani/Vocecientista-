<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz das Misturas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Layout: one centered column (max 720px). A test-tube progress bar sits above a single question card; the result screen ends with a review list of missed questions. */
  :root {
    --bg: #E9F0F2;
    --surface: #FFFFFF;
    --surface-2: #F1F6F7;
    --ink: #10262E;
    --muted: #4F656D;
    --line: #C6D5DA;
    --accent: #0A7C9C;
    --accent-ink: #FFFFFF;
    --accent-soft: #D6EDF4;
    --liquid: #19A5C7;
    --amber: #8A5A00;
    --amber-bg: #FCEFCB;
    --good: #0F7A55;
    --good-bg: #DCF3EA;
    --bad: #B42D45;
    --bad-bg: #FBE3E8;
    --font-display: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B181E;
      --surface: #12262E;
      --surface-2: #173038;
      --ink: #E4F0F3;
      --muted: #9DB4BC;
      --line: #27434D;
      --accent: #4CC3E6;
      --accent-ink: #06232C;
      --accent-soft: #17414E;
      --liquid: #3AB5D8;
      --amber: #F2B83A;
      --amber-bg: #3A2D0C;
      --good: #4FD1A0;
      --good-bg: #12362B;
      --bad: #FF8196;
      --bad-bg: #3A1C25;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B181E;
    --surface: #12262E;
    --surface-2: #173038;
    --ink: #E4F0F3;
    --muted: #9DB4BC;
    --line: #27434D;
    --accent: #4CC3E6;
    --accent-ink: #06232C;
    --accent-soft: #17414E;
    --liquid: #3AB5D8;
    --amber: #F2B83A;
    --amber-bg: #3A2D0C;
    --good: #4FD1A0;
    --good-bg: #12362B;
    --bad: #FF8196;
    --bad-bg: #3A1C25;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
  p { margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .card:focus { outline: none; }

  /* Buttons */
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    min-height: 48px; padding: 12px 22px; font-weight: 800; font-size: 17px; width: 100%;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .btn.ghost:hover { border-color: var(--accent); filter: none; }
  .linkbtn { background: none; border: 0; padding: 6px 4px; color: var(--muted); font-weight: 700; text-decoration: underline; min-height: 32px; }

  /* Start screen */
  .hero { display: flex; gap: 16px; align-items: center; }
  .hero svg { flex: none; }
  .hero h1 { font-size: clamp(30px, 8vw, 44px); font-weight: 700; }
  .hero p { color: var(--muted); font-weight: 600; }
  .greet { font-size: 18px; font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .choice {
    text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .choice strong { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
  .choice span { color: var(--muted); font-size: 14px; font-weight: 600; }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .choice:hover { border-color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
    min-height: 44px; padding: 8px 18px; font-weight: 800;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .best { font-weight: 700; color: var(--muted); font-size: 14px; }

  /* Guide */
  details.guide summary { font-family: var(--font-display); font-size: 19px; font-weight: 600; cursor: pointer; min-height: 32px; }
  details.guide[open] summary { margin-bottom: 12px; }
  .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .gitem { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gitem b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .gitem span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .gitem em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--accent); }

  /* Quiz HUD */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .count { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hud-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .pill { background: var(--amber-bg); color: var(--amber); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 14px; }
  .lives { display: flex; gap: 2px; }
  .tube {
    height: 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface-2); overflow: hidden;
  }
  .tube i {
    display: block; height: 100%; border-radius: 999px; background-color: var(--liquid);
    background-image:
      radial-gradient(circle at 25% 55%, rgba(255,255,255,.55) 2px, transparent 3px),
      radial-gradient(circle at 70% 40%, rgba(255,255,255,.4) 1.5px, transparent 2.5px);
    background-size: 26px 100%;
    transition: width .45s ease;
  }
  .timer { display: flex; align-items: center; gap: 10px; }
  .timer .track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .timer .bar { height: 100%; background: var(--accent); }
  .timer .bar.low { background: var(--bad); }
  .timer b { font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }

  /* Question */
  .qtext { font-size: clamp(21px, 5.2vw, 27px); font-weight: 600; margin-top: 6px; }
  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .opt {
    display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left;
    background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
    font-weight: 700; min-height: 56px; min-width: 0;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
  .chip {
    width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 600; font-size: 17px;
  }
  .opt.ok { border-color: var(--good); background: var(--good-bg); }
  .opt.ok .chip { background: var(--good); color: var(--bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.bad .chip { background: var(--bad); color: var(--bg); }
  .opt.dim { opacity: .75; }
  .fb { border-radius: 14px; padding: 14px 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .fb.good { background: var(--good-bg); }
  .fb.bad { background: var(--bad-bg); }
  .fb-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .fb.good .fb-title { color: var(--good); }
  .fb.bad .fb-title { color: var(--bad); }
  .next { margin-top: 16px; }

  /* Result */
  .rank { font-size: clamp(28px, 7vw, 38px); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; }
  .stat b { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .review { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 12px; }
  .review li { background: var(--surface-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .review .rq { font-weight: 800; }
  .review .ra { color: var(--good); font-weight: 800; }
  .review .re { color: var(--muted); font-size: 15px; font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); font-weight: 600; }


  /* Erick: lore, profile and long-term assessment */
  .lore { background: linear-gradient(135deg, var(--surface), var(--accent-soft)); border: 1px solid var(--line); }
  .lore h2 { font-size: 24px; margin: 4px 0 8px; }
  .lore-quote { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .profile-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .grade { font-family:var(--font-display); font-size:clamp(38px,10vw,54px); line-height:1; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .grade-track { height:12px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
  .grade-track i { display:block; height:100%; background:var(--liquid); border-radius:99px; }
  .profile-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px; }
  .profile-stat { background:var(--surface-2); border-radius:12px; padding:11px 12px; }
  .profile-stat b { display:block; font:600 23px var(--font-display); font-variant-numeric:tabular-nums; }
  .profile-stat span { color:var(--muted); font-size:12px; font-weight:800; }
  .mastery { display:flex; flex-direction:column; gap:8px; }
  .mastery-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; font-size:14px; font-weight:800; }
  .mastery-row .grade-track { grid-column:1 / -1; height:8px; }
  .status-note { border-radius:12px; padding:12px 14px; background:var(--amber-bg); color:var(--amber); font-weight:700; }
  .status-note.good { background:var(--good-bg); color:var(--good); }
  .status-note.bad { background:var(--bad-bg); color:var(--bad); }
  .chapter { display:flex; gap:10px; align-items:flex-start; }
  .chapter b { display:block; font-family:var(--font-display); font-size:17px; }
  .chapter small { color:var(--muted); font-weight:700; }
  .medal { font-size:27px; line-height:1; }

  @media (prefers-reduced-motion: reduce) { .tube i { transition: none; } }
</style>

<script>

    [C_A, "Na reciclagem do lixo eletrônico, qual método pode separar o ferro dos demais componentes?",

      "O ferro é atraído por ímãs. Plástico, vidro e madeira não são."],

      "Decantação", "Filtração", "Evaporação", "Centrifugação",
      "A terra é mais densa e se deposita no fundo. A decantação separa sólidos de líquidos, ou líquidos diferentes, pela densidade."],

    var vmax = S.infinite ? 10 : n;
    var vnow = S.infinite ? (c === 0 ? 0 : ((c - 1) % 10) + 1) : c;
    var pct = Math.round(vnow / vmax * 100);
    var lives = "";
    if (timed) {
      for (var k = 0; k < 3; k++) lives += drop(k < S.lives);
    }
    var h = '' +
      '<div class="hud"><div class="count"><span class="sr">Pergunta </span>' + (S.infinite ? (S.i + 1) + ' · infinito' : (S.i + 1) + ' de ' + n) + '</div>' +
        '<div class="hud-r">' +
          (S.streak >= 2 ? '<span class="pill">Sequência x' + S.streak + '</span>' : '') +
          '<span class="score">' + S.score + ' pts</span>' +
          (timed ? '<span class="lives" role="img" aria-label="' + S.lives + ' de 3 vidas">' + lives + '</span>' : '') +
          '<button class="linkbtn" data-act="' + (S.infinite ? "end" : "quit") + '">' + (S.infinite ? "Encerrar" : "Sair") + '</button>' +
        '</div></div>' +
      '<div class="tube" role="progressbar" aria-valuemin="0" aria-valuemax="' + vmax + '" aria-valuenow="' + vnow + '" aria-label="Progresso"><i style="width:' + pct + '%"></i></div>';
    if (timed) {
      h += '<div class="timer"><div class="track"><div class="bar' + (S.left <= 5 ? ' low' : '') + '" id="tbar" style="width:' + (S.left / TIME * 100) + '%"></div></div><b id="tnum">' + Math.ceil(S.left) + '</b><span class="muted">s</span></div>';
    }
    h += '<section class="card" id="qcard" tabindex="-1">' +
      '<p class="eyebrow">' + q.c + '</p><h2 class="qtext">' + q.q + '</h2><div class="opts" role="group" aria-label="Alternativas">';
    q.opts.forEach(function (o, i) {
      var cls = "";
      if (S.answered) {
        if (o.ok) cls = " ok";
        else if (i === S.last.chosen) cls = " bad";
        else cls = " dim";
      }
      h += '<button class="opt' + cls + '" data-act="pick" data-i="' + i + '"' + (S.answered ? " disabled" : "") + '>' +
        '<span class="chip">' + LETTERS[i] + '</span><span>' + o.t + '</span></button>';
    });
    h += '</div>';
    if (S.answered) {
      var L = S.last, last = isLast();
      h += '<div class="fb ' + (L.ok ? "good" : "bad") + '" role="status">' +
        '<p class="fb-title">' + (L.ok ? "Certo! +" + L.pts + " pts" : (L.timeout ? "O tempo acabou" : "Quase!")) + '</p>' +
        (L.ok ? "" : '<p>Resposta certa: <strong>' + correctText(q) + '</strong></p>') +
        '<p>' + q.e + '</p></div>' +
        '<button class="btn next" data-act="next">' + (last ? "Ver resultado" : "Próxima pergunta") + '</button>';
    }
    h += '</section>';
    return h;
  }

  function resultHTML() {
    var total = S.answers.length;
    var hits = S.answers.filter(function (a) { return a.ok; }).length;
    var pct = total ? Math.round(hits / total * 100) : 0;
    var rank, msg;
    if (pct >= 90) { rank = "Mestre do Laboratório"; msg = "Você dominou os métodos de separação."; }
    else if (pct >= 70) { rank = "Cientista"; msg = "Muito bom! Falta pouco para dominar tudo."; }
    else if (pct >= 50) { rank = "Assistente de Laboratório"; msg = "Bom caminho. Revise os erros abaixo e jogue de novo."; }
    else { rank = "Aprendiz de Laboratório"; msg = "Comece pelo guia dos métodos e treine só os erros."; }
    var misses = S.answers.filter(function (a) { return !a.ok; });
    var h = '<section class="card" id="qcard" tabindex="-1">' +
      '<p class="eyebrow">' + (S.ended === "lives" ? "As gotas acabaram" : "Fim da rodada") + '</p>' +
      '<h2 class="rank">' + rank + '</h2><p class="muted">' + msg + '</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + hits + '/' + total + '</b><span>Acertos</span></div>' +
        '<div class="stat"><b>' + S.score + '</b><span>Pontos' + (S.record ? ' · novo recorde' : '') + '</span></div>' +
        '<div class="stat"><b>' + S.maxStreak + '</b><span>Maior sequência</span></div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn" data-act="again">Jogar de novo</button>' +
        (misses.length ? '<button class="btn ghost" data-act="retry">Treinar só os ' + misses.length + ' erro' + (misses.length > 1 ? 's' : '') + '</button>' : '') +
      '</div></section>';
    if (misses.length) {
      h += '<section class="card"><h3>Para revisar</h3><ul class="review">' +
        misses.map(function (a) {
          return '<li><p class="rq">' + a.q.q + '</p><p class="ra">Resposta certa: ' + correctText(a.q) + '</p><p class="re">' + a.q.e + '</p></li>';
        }).join("") + '</ul></section>';
    }
    h += guideHTML();
    return h;
  }

  /* ---------- fluxo ---------- */
  function isLast() {
    if (S.mode === "desafio" && S.lives <= 0) return true;
    if (S.infinite) return false;
    return S.i + 1 >= S.queue.length;
  }
  function begin(pool, retry) {
    S.infinite = !pool && S.len === "inf";
    S.recent = [];
    if (S.infinite) {
      S.queue = [nextInfinite()];
    } else {
      var base = pool || shuffle(POOL).slice(0, S.len === "all" ? POOL.length : S.len);
      S.queue = shuffle(base).map(prepare);
    }
    S.i = 0; S.score = 0; S.streak = 0; S.maxStreak = 0; S.lives = 3;
    S.answers = []; S.answered = false; S.last = null; S.left = TIME;
    S.retry = !!retry; S.ended = ""; S.record = false;
    S.view = "quiz";
    render();
  }
  function pick(i) {
    if (S.answered || S.view !== "quiz") return;
    stopTimer();
    var q = S.queue[S.i];
    var ok = i >= 0 && q.opts[i].ok;
    var pts = 0;
    if (ok) {
      S.streak++;
      pts = 100;
      if (S.mode === "desafio") pts += Math.round(50 * (S.left / TIME));
      if (S.streak >= 2) pts += Math.min(S.streak - 1, 5) * 10;
      S.score += pts;
      if (S.streak > S.maxStreak) S.maxStreak = S.streak;
    } else {
      S.streak = 0;
      if (S.mode === "desafio") S.lives--;
    }
    S.answers.push({ q: q, chosen: i, ok: ok, timeout: i < 0, pts: pts });
    S.answered = true;
    S.last = { ok: ok, pts: pts, timeout: i < 0, chosen: i };
    render();
  }
  function next() {
    if (!S.answered) return;
    if (isLast()) { finish(); return; }
    if (S.infinite) S.queue.push(nextInfinite());
    S.i++; S.answered = false; S.last = null; S.left = TIME;
    render();
  }
  function finish() {
    stopTimer();
    if (S.mode === "desafio" && S.lives <= 0) S.ended = "lives";
    if (!S.retry && !S.infinite && S.answers.length) {
      recordAttempt();
    }
    if (!S.retry) {
      var hits = S.answers.filter(function (a) { return a.ok; }).length;
      var prev = loadBest()[bestKey()];
      if (!prev || S.score > prev.score) {
        S.record = !!prev || S.score > 0;
        saveBest(bestKey(), { score: S.score, hits: hits, total: S.answers.length });
      }
    }
    S.view = "result";
    render();
  }
  function startTimer() {
    stopTimer();
    if (S.mode !== "desafio") return;
    S.t0 = performance.now();
    S.timer = setInterval(function () {
      var left = Math.max(0, TIME - (performance.now() - S.t0) / 1000);
      S.left = left;
      var b = document.getElementById("tbar"), n = document.getElementById("tnum");
      if (b) { b.style.width = (left / TIME * 100) + "%"; if (left <= 5) b.classList.add("low"); }
      if (n) n.textContent = Math.ceil(left);
      if (left <= 0) pick(-1);
    }, 100);
  }

  function render() {
    var firstOfScreen = true;
    if (S.view === "start") app.innerHTML = startHTML();
    else if (S.view === "quiz") { app.innerHTML = quizHTML(); firstOfScreen = !S.answered; }
    else app.innerHTML = resultHTML();

    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (S.view === "quiz" && S.answered) {
      var fb = app.querySelector(".fb");
      if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    } else if (firstOfScreen) {
      window.scrollTo(0, 0);
      var c = document.getElementById("qcard");
      if (c) c.focus({ preventScroll: true });
    }
    if (S.view === "quiz" && !S.answered) startTimer();
  }

  /* ---------- eventos ---------- */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (a === "mode") { S.mode = v; render(); }
    else if (a === "len") { S.len = (v === "all" || v === "inf") ? v : Number(v); render(); }
    else if (a === "go" || a === "again") { if (a === "again") { S.view = "start"; render(); } else begin(); }
    else if (a === "pick") pick(Number(el.getAttribute("data-i")));
    else if (a === "next") next();
    else if (a === "retry") {
      var wrong = S.answers.filter(function (x) { return !x.ok; }).map(function (x) { return x.q; });
      begin(wrong, true);
    }
    else if (a === "quit") { stopTimer(); S.view = "start"; render(); }
    else if (a === "resetprofile") {
      if (window.confirm("Zerar todo o histórico acadêmico do Erick neste navegador?")) {
        try { localStorage.removeItem(PROFILE_KEY); } catch (e) {}
        render();
      }
    }
    else if (a === "end") {
      if (S.answers.length) finish();
      else { stopTimer(); S.view = "start"; render(); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (S.view !== "quiz") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var isBtn = e.target && e.target.tagName === "BUTTON";
    if (!S.answered) {
      var k = e.key.toLowerCase();
      var idx = "1234".indexOf(k);
      if (idx < 0) idx = "abcd".indexOf(k);
      if (idx > -1 && k.length === 1) { e.preventDefault(); pick(idx); }
    } else if ((e.key === "Enter" || e.key === " ") && !isBtn) {
      e.preventDefault(); next();
    }
  });

  render();
})();
</script>

</body></html>
